<main class="form-signin w-100 m-auto">
    <form [formGroup]="loginForm" class="container text-center" (ngSubmit)="fazerLogin()">
        <div class="row align-items-center justify-content-center">
            <div class="col-lg-4 col-md-6 col-10">
                <img class="mb-4" src="assets/imagens/trello_logo.png" alt="" width="150px">

                <div class="form-floating">
                    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com"
                        formControlName="email">
                    <label for="floatingInput">E-mail</label>
                    <div *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched"
                        class="text-danger">
                        <small *ngIf="loginForm.controls['email'].errors?.['required']">O e-mail é obrigatório.</small>
                        <small *ngIf="loginForm.controls['email'].errors?.['email']">Formato de e-mail inválido.</small>
                    </div>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Password"
                        formControlName="senha">
                    <label for="floatingPassword">Senha</label>
                    <div *ngIf="loginForm.controls['senha'].invalid && loginForm.controls['senha'].touched"
                        class="text-danger">
                        <small *ngIf="loginForm.controls['senha'].errors?.['required']">A senha é obrigatória.</small>
                        <small *ngIf="loginForm.controls['senha'].errors?.['minlength']">A senha deve ter pelo menos 6
                            caracteres.</small>
                        <small *ngIf="loginForm.controls['senha'].errors?.['pattern']">A senha deve conter ao menos uma
                            letra maiúscula, uma letra minúscula, um número e um caractere especial.</small>
                    </div>
                </div>

                <div class="form-check text-start my-3">
                    <input class="form-check-input" type="checkbox" id="flexCheckDefault"
                        formControlName="manterConectado">
                    <label class="form-check-label" for="flexCheckDefault">
                        Mantenha-me conectado
                    </label>
                </div>

                <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="loginForm.invalid">Acessar</button>
                <div class="text-center mt-3">
                    <small class="text-danger">{{ erro }}</small>
                </div>
                <p class="mt-5 mb-3 text-body-secondary">Treina Recife &copy; 2025</p>
            </div>
        </div>
    </form>
</main>
